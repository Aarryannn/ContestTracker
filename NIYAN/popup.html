
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConTrack</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>

<body class="w-95 bg-zinc-950 font-sans text-zinc-100">
  <div class="p-5">
    <header class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-tight">ConTack</h1>
        <p class="mt-1 text-xs text-zinc-500">All of your coding contests are listed here...</p>
      </div>

      <button id="refreshBtn"
        class="rounded-lg border border-zinc-800 bg-zinc-900 p-2 text-zinc-300 hover:bg-zinc-800">
        ↻
      </button>
    </header>

    <section class="mb-5 rounded-xl border border-zinc-800 bg-zinc-900 p-4">
      <p class="text-xs uppercase tracking-widest text-zinc-500">Upcoming contests</p>
      <div class="mt-2 flex items-end justify-between">
        <h2 id="contestCount" class="text-3xl font-bold">0</h2>
        <p id="nextCountdown" class="font-mono text-sm text-orange-500">--</p>
      </div>
      <p class="mt-1 text-xs text-zinc-500">Scheduled challenges</p>
    </section>

    <input
      id="searchInput"
      type="search"
      placeholder="Search contests..."
      class="mb-3 w-full rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-2.5 text-sm outline-none placeholder:text-zinc-600 focus:border-orange-500"
    >

    <div class="mb-4 flex gap-2">
      <button data-filter="all" class="filterBtn rounded-lg bg-white px-3 py-2 text-xs font-semibold text-zinc-950">All</button>
      <button data-filter="LeetCode" class="filterBtn rounded-lg border border-zinc-800 px-3 py-2 text-xs text-zinc-400">LeetCode</button>
      <button data-filter="Codeforces" class="filterBtn rounded-lg border border-zinc-800 px-3 py-2 text-xs text-zinc-400">Codeforces</button>
    </div>

    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-sm font-semibold">Contest schedule</h2>
      
    </div>

    <main id="contestList" class="max-h-87.5 space-y-3 overflow-y-auto">
      <p class="text-sm text-zinc-500">Loading contests...</p>
    </main>

    <footer class="mt-5 border-t border-zinc-800 pt-3 text-xs text-zinc-600">
     <pre>Made by Aryann...
For any Queries or to report Bugs 
Email me at : arryann023@gmail.com</pre>
    </footer>
  </div>
</body>
</html>
